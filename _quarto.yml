project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - publications.qmd
    - talks.qmd
    - cv.qmd
    - notes/
    - "!notes/**/template.qmd"
  resources:
    - images/
    - files/

editor:
  render-on-save: true

website:
  title: "Deep Chat of Perplexity"
  description: "Soo Min Kimm — research notes, publications, and talks."
  favicon: images/favicon.svg
  site-url: "https://somnio-kimm.github.io"
  repo-url: "https://github.com/somnio-kimm/somnio-kimm.github.io"
  search:
    location: navbar
    type: overlay
  navbar:
    background: primary
    pinned: true
    left:
      - href: index.qmd
        text: Home
      - href: cv.qmd
        text: CV
      - href: publications.qmd
        text: Publications
      - href: talks.qmd
        text: Talks
      - text: Notes
        menu:
          - href: notes/literature-review/index.qmd
            text: Literature Review
          - href: notes/study-notes/index.qmd
            text: Study Notes
    right:
      - icon: github
        href: https://github.com/somnio-kimm
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/somnio-kimm/
        aria-label: LinkedIn
  sidebar:
    - id: notes
      title: "Literature Review"
      style: floating
      collapse-level: 1
      contents:
        - href: notes/literature-review/index.qmd
          text: "All literature reviews"
        - section: "Action"
          href: notes/literature-review/action/index.qmd
          contents: "notes/literature-review/action/*.qmd"
        - section: "Theory"
          href: notes/literature-review/theory/index.qmd
          contents: "notes/literature-review/theory/*.qmd"
        - section: "Vision"
          href: notes/literature-review/vision/index.qmd
          contents: "notes/literature-review/vision/*.qmd"
        - section: "Language"
          href: notes/literature-review/language/index.qmd
          contents: "notes/literature-review/language/*.qmd"
        - section: "Multimodality"
          href: notes/literature-review/multimodality/index.qmd
          contents: "notes/literature-review/multimodality/*.qmd"
    - id: study-notes
      title: "Study Notes"
      style: floating
      collapse-level: 1
      contents:
        - href: notes/study-notes/index.qmd
          text: "All study notes"
        - section: "Mathematics"
          href: notes/study-notes/mathematics/index.qmd
          contents: "notes/study-notes/mathematics/*.qmd"
        - section: "Machine Learning"
          href: notes/study-notes/machine-learning/index.qmd
          contents: "notes/study-notes/machine-learning/*.qmd"
        - section: "Robotics"
          href: notes/study-notes/robotics/index.qmd
          contents: "notes/study-notes/robotics/*.qmd"
        - text: "Physics"
          href: notes/study-notes/physics/index.qmd
        - href: notes/study-notes/computer-hardware/index.qmd
          text: "Computer Hardware"
        - section: "Computer Software"
          href: notes/study-notes/computer-software/index.qmd
          contents: "notes/study-notes/computer-software/*.qmd"
  page-footer:
    center: "© 2026 Soo Min Kimm · Built with [Quarto](https://quarto.org)"

format:
  html:
    include-in-header: _includes/favicon.html
    theme:
      light: [cosmo, styles.scss]
      dark: [darkly, styles.scss]
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    highlight-style: github
    html-math-method: mathjax
    mermaid:
      theme: default
    grid:
      sidebar-width: 320px
