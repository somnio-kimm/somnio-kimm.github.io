# Glossary file index. Add terms in the subject files below, in any order.
# The same entries supply definition bubbles and searchable word cards.
# New entry example:
#   your-term:
#     label: Your term
#     tags: [mathematics, machine-learning]
#     definition: A short plain-text definition.
# Syntax in notes: [display text]{.term key="your-term"}
# Tags: mathematics, machine-learning, robotics, physics, computer-hardware, computer-software.
# Each filename matches a study-note subject folder. Keep each term in one file.
# Add a path here when adding a new subject folder and glossary file.
files:
  - _glossary/computer-hardware.yml
  - _glossary/computer-software.yml
  - _glossary/machine-learning.yml
  - _glossary/mathematics.yml
  - _glossary/physics.yml
  - _glossary/robotics.yml
