# Control glossary cards.
# Add terms anywhere in this file; the card page sorts them automatically.
# Use short plain-text definitions and reusable lowercase tags.

dynamics:
  label: Environment dynamics
  tags: [control, dynamical-systems, robotics]
  definition: The rule or probability law by which a system’s state evolves, potentially depending on
    the current state and action. It describes the environment’s evolution rather than the policy’s action
    selection.

feedback:
  label: Feedback
  tags: [control, dynamical-systems, robotics]
  definition: Information measured from a system and used to update subsequent decisions about that system.
    In control, the relevant feedback level may be task planning or a lower-level motor loop.

geometric-decay:
  label: Geometric decay
  tags: [control, dynamical-systems]
  definition: A sequence of nonnegative weights in which each successive weight is multiplied by the same
    factor smaller than one. In an EMA, this factor determines how quickly older observations lose weight.

homogeneous-response:
  label: Homogeneous response
  tags: [control, dynamical-systems]
  definition: The part of a dynamical system response generated by its initial state when the external
    input is zero.

numerical-solver:
  label: Numerical solver
  tags: [control, dynamical-systems, numerical-methods]
  definition: An algorithm that approximates the solution to a mathematical problem. For an ordinary differential
    equation, it computes successive approximate states from a derivative field.

recurrence:
  label: Recurrence
  tags: [control, dynamical-systems]
  definition: A rule defining each value of a sequence using earlier values and, when applicable, new
    inputs. Initial values are needed to determine the sequence.

state-vector:
  label: State vector
  tags: [control, dynamical-systems]
  definition: Coordinates representing the information a dynamical model uses to specify subsequent evolution,
    or its probability law, given future inputs. The entries may describe physical quantities or an internal
    model representation.
